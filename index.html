<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HANAN - Home</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style type="text/tailwindcss">
  @theme {
    --color-brand: #7c3aed;
    --color-muted: #6b5b7e;
    --font-display: "Sora", sans-serif;
    --font-sans: "Inter", system-ui, sans-serif;
  }

  h1 {
    font-size: clamp(2rem, 5vw + 1rem, 4rem);
    font-family: var(--font-display);
  }

  h2 {
    font-size: clamp(1.5rem, 3vw + 0.5rem, 2.5rem);
    font-family: var(--font-display);
  }

  body {
    font-family: var(--font-sans);
  }
</style>
  </head>
  <body class="bg-white text-zinc-900 dark:bg-zinc-900 dark:text-zinc-100 min-h-screen">

    <header class="flex items-center justify-between px-8 py-4 border-b border-zinc-200 dark:border-zinc-700">
      <a href="index.html" class="text-brand font-bold font-display text-2xl no-underline">HANAN</a>
      <nav>
        <ul class="flex gap-6 list-none m-0 p-0">
          <li><a href="index.html" class="text-zinc-900 dark:text-zinc-100 no-underline font-semibold hover:text-brand">Home</a></li>
          <li><a href="projects.html" class="text-zinc-900 dark:text-zinc-100 no-underline font-semibold hover:text-brand">Projects</a></li>
          <li><a href="contact.html" class="text-zinc-900 dark:text-zinc-100 no-underline font-semibold hover:text-brand">Contact</a></li>
        </ul>
      </nav>
      <button id="theme-toggle" class="px-3 py-1 rounded border border-zinc-300 dark:border-zinc-600 text-sm cursor-pointer">
        Toggle Dark Mode
      </button>
    </header>

    <main class="max-w-3xl mx-auto px-4 py-8">

      <section class="mb-8">
        <h1 class="text-brand mb-2">Hi, I'm HANAN</h1>
        <p class="text-lg mb-2">I'm a beginner web developer.</p>
        <p class="text-lg mb-4">I'm currently in Week 4 of my mentorship journey.</p>
        <a href="projects.html" class="text-brand underline font-semibold">See My Projects</a>
      </section>

      <section class="mb-8">
        <h2 class="mb-2">About Me</h2>
        <p>I care about writing clean and readable code. My goal is to become a full-stack developer.</p>
      </section>

    </main>

    <footer class="px-8 py-4 border-t border-zinc-200 dark:border-zinc-700 text-sm text-muted">
      <p>Built by HA | <a href="https://github.com/Hanan319" class="text-brand">github.com/Hanan319</a></p>
    </footer>

    <script>
      document.getElementById("theme-toggle").addEventListener("click", () => {
        document.documentElement.classList.toggle("dark");
        localStorage.setItem("theme", document.documentElement.classList.contains("dark") ? "dark" : "light");
      });
    </script>

  </body>
</html>
